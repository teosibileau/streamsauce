ahoyapi: v2
usage: Streamsauce commands
env: .env
commands:
  docker:
    usage: Run docker-compose commands
    imports:
      - .ahoy/docker.ahoy.yml
  dbos:
    usage: Run dbos commands
    imports:
      - .ahoy/dbos.ahoy.yml
  setup:
    usage: Setup commands
    imports:
      - .ahoy/setup.ahoy.yml
  up:
    usage: Start services by profile
    imports:
      - .ahoy/up.ahoy.yml
  stream:
    usage: Stream a video file from input/ to mediamtx in a loop (e.g. ahoy stream people_walking.mp4)
    cmd: |
      docker run --rm --network host -v $(pwd)/input:/input:ro linuxserver/ffmpeg -re -stream_loop -1 -i /input/$1 -c copy -f rtsp -rtsp_transport tcp rtsp://0.0.0.0:8554/cam1
  clean:
    usage: Remove all jpg, ts, and m3u8 files from output directories
    cmd: |
      find output -type f \\( -name '*.jpg' -o -name '*.ts' -o -name '*.m3u8' \\) -delete
