---
ahoyapi: v2
commands:
  all:
    usage: Start all services
    cmd: |
      COMPOSE_PROFILES="chop,input" ahoy $@
  chop:
    usage: Start chop services (chopper, emitter, nginx, broker)
    cmd: |
      COMPOSE_PROFILES="chop,${COMPOSE_PROFILES}" ahoy $@
  input:
    usage: Start input services (mediamtx)
    cmd: |
      COMPOSE_PROFILES="input,${COMPOSE_PROFILES}" ahoy $@
