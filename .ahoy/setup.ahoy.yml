---
ahoyapi: v2
commands:
  install:
    usage: Install dependencies
    cmd: |
      poetry install

  export-model:
    usage: Export YOLO model to ONNX format (e.g. ahoy setup export-model -- --model yolo11n)
    cmd: |
      poetry run python scripts/export_model.py $@

  precommit:
    usage: Setup pre-commit hooks
    cmd: |
      if git config --unset-all core.hooksPath; then \
        echo "Unset core.hooksPath"; \
      else \
        echo "core.hooksPath was not set"; \
      fi
      rm -rf .git/hooks
      pre-commit install
