---
services:
  postgres:
    image: postgres:15
    container_name: dbos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbos}
      POSTGRES_DB: ${POSTGRES_DB:-dbos}
    ports:
      - "5432:5432"
    volumes:
      - dbos_pg_data:/var/lib/postgresql/data

  broker:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "1883:1883"
      - "15672:15672"
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_mqtt --offline &&
      rabbitmq-server"

  chopper:
    image: ghcr.io/teosibileau/streamchop/chopper:v0.1.1
    restart: unless-stopped
    profiles:
      - chop
    environment:
      - RTSP_URL=${CAM1_RTSP_URL}
    volumes:
      - ./output/cam1:/output

  emitter:
    image: ghcr.io/teosibileau/streamchop/emitter:v0.1.1
    restart: unless-stopped
    profiles:
      - chop
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-streamchop}
      - HLS_BASE_URL=${HLS_BASE_URL}
      - WATCH_DIR=/output
      - RUST_LOG=info
    volumes:
      - ./output:/output:ro
    depends_on:
      - broker

  nginx:
    image: ghcr.io/teosibileau/streamchop/nginx:v0.1.1
    restart: unless-stopped
    profiles:
      - chop
    ports:
      - "8080:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro

  cam:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    profiles:
      - input
    environment:
      - MTX_PROTOCOLS=tcp
    ports:
      - "8554:8554"

volumes:
  dbos_pg_data:
